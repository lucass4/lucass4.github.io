name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running production deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the version used locally.
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI (extended - the theme compiles Sass)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Production builds run the theme's Sass output through PostCSS for
      # autoprefixing, which needs the theme's own pinned Node tooling.
      # `hugo server` skips this step, so it only shows up in CI and in
      # local production builds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: themes/introduction/package-lock.json

      - name: Install theme PostCSS tooling
        run: npm ci --ignore-scripts
        working-directory: themes/introduction

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          PATH="$PWD/themes/introduction/node_modules/.bin:$PATH" \
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
