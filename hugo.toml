baseURL = "https://lucassantanna.ca/"
title = "Lucas Sant' Anna"
locale = "en-CA"
defaultContentLanguage = "en"
enableRobotsTXT = true
# Tags render as labels from front matter; no archive pages until there is
# enough writing to justify them, and an empty /tags/ page is worse than none.
disableKinds = ["taxonomy", "term"]
enableGitInfo = false

# CI passes --baseURL from the Pages action, so the value above only matters
# for local builds. See .github/workflows/pages.yml.

# Nothing here sets `theme`: the layouts in layouts/ are the theme.

[params]
  description = "Lucas Sant' Anna designs platforms and leads the teams that build them. Distributed systems, cloud infrastructure, Kubernetes and platform engineering."
  authorName = "Lucas Sant' Anna"
  location = "Metro Vancouver, Canada"
  headline = "I design platforms and lead the teams that build them."
  # Deliberately no email address. It would be scraped out of the rendered HTML.
  linkedin = "https://linkedin.com/in/lucassantanna"
  github = "https://github.com/lucass4"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.highlight]
    # Classes, not inline styles, so one highlight theme can follow light/dark.
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[imaging]
  resampleFilter = "lanczos"
  [imaging.webp]
    quality = 82
  [imaging.jpeg]
    quality = 82

[minify]
  [minify.tdewolff.html]
    keepQuotes = true

[services.rss]
  limit = 20

[sitemap]
  changefreq = "monthly"
  priority = 0.5
