<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__meta">
      <span>{{ site.Params.authorName }}</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>{{ site.Params.location }}</span>
    </p>
    <ul class="site-footer__links">
      <li><a href="{{ site.Params.linkedin }}" rel="me noopener">LinkedIn</a></li>
      <li><a href="{{ site.Params.github }}" rel="me noopener">GitHub</a></li>
      {{- with site.Home.OutputFormats.Get "rss" }}
      <li><a href="{{ .RelPermalink }}">RSS</a></li>
      {{- end }}
    </ul>
  </div>
</footer>
