{{ define "main" }}
<div class="wrap wrap--narrow">
  <header class="page-head">
    <h1 class="page-head__title">{{ .Title }}</h1>
    {{- with .Content }}
    <div class="page-head__lede">{{ . }}</div>
    {{- end }}
  </header>

  <ol class="case-list case-list--index">
    {{- range .RegularPages }}
    {{ partial "case-preview.html" (dict "page" . "level" 2) }}
    {{- end }}
  </ol>
</div>
{{ end }}
